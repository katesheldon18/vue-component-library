trigger:
  branches:
    include:
      - main
      - test/button/unit-tests

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: 'Use Node.js 22'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm test
    displayName: 'Run unit tests'
